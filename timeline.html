<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Through Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="timeline.css">
</head>
<body>
  <a class="home" href="index.html">&larr; Home</a>
  <h1>Music Through Time</h1>

  <section class="stage" aria-live="polite">
    <article class="slide" id="slide"></article>
  </section>

  <div class="controls">
    <button id="prev" class="arrow" aria-label="Previous era">&larr;</button>
    <ol class="track" id="track" aria-label="Eras"></ol>
    <button id="next" class="arrow" aria-label="Next era">&rarr;</button>
  </div>
  <p class="hint">Use the arrows, your keyboard arrow keys, or swipe.</p>

  <script src="timeline-data.js"></script>
  <script src="timeline.js"></script>
</body>
</html>
